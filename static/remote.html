<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云电脑采集工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17263d;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{background:#14253e;color:white;padding:28px 6vw}header small{color:#a8c0df}main{max-width:1200px;margin:28px auto;padding:0 24px;display:grid;grid-template-columns:340px 1fr;gap:24px}.card{background:white;border:1px solid #e1e6ef;border-radius:14px;padding:24px;margin-bottom:18px}h1{margin:0;font-size:26px}h2{font-size:18px;margin:0 0 18px}.notice{background:#fff4d8;color:#71501b;padding:12px;border-radius:8px;font-size:13px}textarea{width:100%;min-height:160px;padding:12px;border:1px solid #cbd4e1;border-radius:8px;font:inherit;margin:14px 0}button{background:#2563eb;color:white;border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font:inherit}button:disabled{opacity:.5}.wide{width:100%;margin-top:18px}label{margin-right:14px}#tasks button{display:block;width:100%;background:#f1f5fb;color:#24364f;text-align:left;margin:8px 0;font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f7f9fc;padding:16px;border-radius:8px}.badge{background:#e9efff;color:#3159b4;padding:3px 9px;border-radius:20px;font-size:12px}.meta{color:#748199;font-size:12px}a{color:#245fcb}#error{color:#b42318}#detail:empty:after{content:'提交问题或选择历史任务，查看各平台执行进度。';color:#748199}@media(max-width:800px){main{grid-template-columns:1fr}}
#devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;max-height:360px;overflow:auto;margin-top:15px}#devices>div{background:#f7f9fc;padding:10px;border-radius:8px}#devices p{font-size:13px;margin:0 0 8px}#devices button{font-size:12px;padding:7px 10px}</style><header><small>REMOTE COLLECTOR / 设备调度版</small><h1>云电脑采集工作台</h1></header><main><aside><section class="card"><h2>新建采集任务</h2><div class="notice">真实采集需先登录平台。关闭登录窗口后提交任务；页面变化会暂停，不会返回模拟回答。</div><form id="form"><textarea id="question" maxlength="10000" required placeholder="输入要采集的问题…"></textarea><div><label><input type="checkbox" name="platform" value="doubao" checked>豆包</label><label><input type="checkbox" name="platform" value="deepseek" checked>DeepSeek</label><label><input type="checkbox" name="platform" value="yuanbao">元宝</label><label><input type="checkbox" name="platform" value="qianwen">千问</label></div><p>联网：<select id="search"><option value="auto">平台默认（不保证联网）</option><option value="true">必须开启联网</option><option value="false">必须关闭联网</option></select></p><p>执行：<select id="mode"><option value="real">真实浏览器</option></select></p><p class="meta">在客户端 EXE 登录平台并启动采集后，服务器会自动分配任务。</p><button class="wide" id="submit">创建采集任务</button><p id="error" role="alert"></p></form></section><section class="card"><h2>最近任务</h2><div id="tasks"></div></section></aside><section><section class="card"><h2>采集设备</h2><p class="meta">每台设备一个密钥；同设备、同平台最多执行一个任务。</p><button id="add-device" type="button">新增设备</button><pre id="device-secret" hidden></pre><div id="devices"></div><p id="device-error" role="alert"></p></section><div class="card"><h2>采集结果 <span class="badge">真实浏览器采集</span></h2><div id="detail"></div></div><p class="meta">远程调度 · 设备各自保存登录状态 · API 文档：<a href="/docs" target="_blank">/docs</a></p></section></main>
<script>
const labels={queued:'排队中',running:'执行中',succeeded:'完成',failed:'失败',partial:'部分完成',waiting_human:'等待人工',checking_login:'检查登录',opening_chat:'新建对话',configuring:'配置选项',submitting:'提交问题',generating:'生成回答',extracting:'提取正文',capturing:'采集证据',uploading:'上传结果',done:'完成',lease_expired:'租约过期'};
let pendingSubmission=null;let selected=null;let rendered='';const el=id=>document.getElementById(id);function node(tag,text,parent,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;parent.append(n);return n}
async function api(path,opts){const r=await fetch(path,opts);const v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:JSON.stringify(v.detail));return v}
async function refresh(){try{const tasks=await api('/api/v2/tasks');el('tasks').replaceChildren();for(const t of tasks){const b=node('button',t.question.slice(0,45)+' · '+labels[t.status],el('tasks'));b.onclick=()=>{selected=t.id;refresh()}}if(selected){const t=tasks.find(t=>t.id===selected)||await api('/api/v2/tasks/'+selected);const signature=JSON.stringify(t);if(rendered===signature)return;rendered=signature;const d=el('detail');d.replaceChildren();node('h3',t.question,d);node('p','任务 '+t.id+' · '+new Date(t.created*1000).toLocaleString('zh-CN',{timeZone:'Asia/Taipei'}),d,'meta');for(const j of t.jobs){const c=node('section','',d,'card');node('h2',({doubao:'豆包',deepseek:'DeepSeek',yuanbao:'元宝',qianwen:'千问'}[j.platform]||j.platform)+' · '+labels[j.status],c);node('p','阶段：'+(labels[j.stage]||j.stage)+' / 尝试 '+j.attempt,c,'meta');if(j.error)node('p',j.error,c);if(j.status==='waiting_human'){const b=node('button','已处理，恢复原任务',c);b.onclick=async()=>{try{await api('/api/v2/jobs/'+j.id+'/resume',{method:'POST'});await refresh()}catch(e){el('error').textContent=e.message}}}if(j.result){renderExtra(j.result,c);node('pre',j.result.answer,c);if(j.result.mock){node('p','模拟结果，无真实截图和引用',c,'notice');const a=node('a','下载模拟记录 JSON',c);a.href=j.result.artifact_url}else{node('p','真实网页正文 · '+(j.result.answer_complete?'回答已结束':'回答可能未完成'),c,'badge');for(const msg of j.result.limitations||[])node('p',msg,c,'notice');for(const a of j.result.artifacts||[]){if(a.mime==='image/png'){if(j.result.long_image_complete&&a.kind==='screenshot')continue;const img=node('img','',c);img.src=a.url;img.style='max-width:100%;display:block;margin:12px 0';img.alt='真实页面截图'}else{const link=node('a','下载 '+({answer_text:'完整回复 TXT',answer_html:'回答 HTML',manifest:'证据清单'}[a.kind]||a.kind),c);link.href=a.url;node('br','',c)}}for(const r of j.result.references||[]){const a=node('a',(r.relation==='cited'?'[正文引用] ':r.relation==='search_result'?'[搜索资料] ':'[正文链接] ')+(r.title||r.displayed_url||'未提供标题')+(r.displayed_url?'':'（网页未提供网址）'),c);if(/^https?:\/\//i.test(r.displayed_url||'')){a.href=r.displayed_url;a.target='_blank';a.rel='noopener noreferrer'}node('br','',c)}}}}}}catch(e){el('error').textContent=e.message}}
el('form').onsubmit=async e=>{e.preventDefault();el('error').textContent='';const platforms=[...document.querySelectorAll('[name=platform]:checked')].map(n=>n.value);if(!platforms.length){el('error').textContent='请至少选择一个平台';return}el('submit').disabled=true;try{const payload={question:el('question').value,platforms,web_search:el('search').value==='auto'?null:el('search').value==='true',mode:'real'};const raw=JSON.stringify(payload);if(!pendingSubmission||pendingSubmission.raw!==raw)pendingSubmission={raw,key:crypto.randomUUID()};sessionStorage.setItem('pendingSubmission',JSON.stringify(pendingSubmission));const t=await api('/api/v3/tasks',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':pendingSubmission.key},body:JSON.stringify({question:el('question').value,platforms,web_search:el('search').value==='auto'?null:el('search').value==='true',mode:el('mode').value})});selected=t.id;pendingSubmission=null;sessionStorage.removeItem('pendingSubmission');await refresh()}catch(e){el('error').textContent=e.message}finally{el('submit').disabled=false}};try{pendingSubmission=JSON.parse(sessionStorage.getItem('pendingSubmission'))}catch{};refresh();setInterval(refresh,2000);

async function refreshDevices(){try{const devices=await api('/api/v3/devices');el('devices').replaceChildren();for(const d of devices){const row=node('div','',el('devices'));node('p',d.name+' · '+(!d.enabled?'已停用':d.online?'在线':'离线')+' · 执行中 '+d.running+' / 并发上限 '+d.max_slots,row);const b=node('button',d.max_slots===0?'恢复领取':'停止领取',row);b.onclick=async()=>{try{await api('/api/v3/devices/'+d.id+'/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:d.enabled,max_slots:d.max_slots===0?1:0})});refreshDevices()}catch(e){el('device-error').textContent=e.message}};const toggle=node('button',d.enabled?'停用凭据':'启用凭据',row);toggle.style.marginLeft='8px';toggle.onclick=async()=>{try{await api('/api/v3/devices/'+d.id+'/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:!d.enabled,max_slots:d.max_slots})});refreshDevices()}catch(e){el('device-error').textContent=e.message}}}}catch(e){el('device-error').textContent=e.message}}
el('add-device').onclick=async()=>{const name=prompt('设备名称，如采集电脑01');if(!name)return;try{const d=await api('/api/v3/devices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,max_slots:1})});el('device-secret').hidden=false;el('device-secret').textContent='密钥仅显示本次，请填入对应客户端，勿发给他人。\n服务器地址：'+location.origin+'\n设备编号：'+d.device_id+'\n设备密钥：'+d.device_key;refreshDevices()}catch(e){el('device-error').textContent=e.message}};
refreshDevices();setInterval(refreshDevices,5000);
</script><script src="/static/client-onboarding.js"></script></html>
